plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
    id "com.newrelic.agent.android"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def resolvedKeyPropertiesPath = null
if (project.hasProperty('keyProperties')) {
    resolvedKeyPropertiesPath = project.property('keyProperties')
} else {
    def signingDir = localProperties.getProperty('signingDir')
    def signingProfile = project.hasProperty('signingProfile') ? project.property('signingProfile') : localProperties.getProperty('signingProfile')

    if (signingDir && signingProfile) {
        resolvedKeyPropertiesPath = "${signingDir}/${signingProfile}.properties"
    } else {
        resolvedKeyPropertiesPath = localProperties.getProperty('keyProperties')
    }
}

def flutterVersionCode = project.hasProperty('flutter.versionCode') ? project['flutter.versionCode'].toInteger() : 1
def flutterVersionName = project.hasProperty('flutter.versionName') ? project['flutter.versionName'] : "1.0.0"
def flutterCompileSdkVersion = project.hasProperty('flutter.compileSdkVersion') ? project['flutter.compileSdkVersion'] : 35
def flutterTargetSdkVersion = project.hasProperty('flutter.targetSdkVersion') ? project['flutter.targetSdkVersion'] : 35
def flutterMinSdkVersion = project.hasProperty('flutter.minSdkVersion') ? project['flutter.minSdkVersion'] : 21

android {
    namespace "com.waioz.cartel"
    compileSdk flutterCompileSdkVersion.toInteger()
    ndkVersion "27.0.12077973"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.waioz.cartel"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        // Required for FCM
        multiDexEnabled true
    }

    signingConfigs {
        release {
            if (resolvedKeyPropertiesPath != null) {
                def keyPropertiesFile = file(resolvedKeyPropertiesPath)
                def keyProps = new Properties()
                keyProps.load(new FileInputStream(keyPropertiesFile))

                def storePathFile = new File(keyProps['storeFile'])
                storeFile storePathFile.isAbsolute() ? storePathFile : new File(keyPropertiesFile.parentFile, keyProps['storeFile'])
                storePassword keyProps['storePassword']
                keyAlias keyProps['keyAlias']
                keyPassword keyProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:32.1.1') // Use latest BOM
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.stripe:stripe-android:17.1.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
