# Jetifier exhausts the previous 2 GB heap while transforming Flutter's
# arm64 debug artifact. Keep the build bounded while giving it enough heap.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=512m
org.gradle.workers.max=2
org.gradle.parallel=false
kotlin.daemon.jvmargs=-Xmx512m
android.useAndroidX=true
android.enableJetifier=true
flutter.versionCode=1
flutter.versionName=1.5.0
flutter.compileSdkVersion=36
flutter.targetSdkVersion=35
flutter.minSdkVersion=23
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
