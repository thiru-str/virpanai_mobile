// Top-level build file
buildscript {
    repositories {
        google() // Required for Firebase
        mavenCentral() // General Maven repository
    }
    dependencies {
        // Google Services plugin for Firebase
        classpath 'com.google.gms:google-services:4.3.15'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Define the build directory
rootProject.buildDir = '../build'

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    // Older plugins use API 33 while their AndroidX dependencies require 34.
    // Preserve higher SDK versions without forcing legacy plugins onto API 36.
    plugins.withId('com.android.library') {
        extensions.getByName('androidComponents').finalizeDsl { androidDsl ->
            androidDsl.compileSdk = Math.max(androidDsl.compileSdk ?: 34, 34)
        }
    }
}

subprojects {
    project.evaluationDependsOn(':app')
}

// Clean task
tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
